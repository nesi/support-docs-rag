# Refreshes the nesi-docs Vectorize index. Runs on a pipeline schedule
# (CI/CD > Schedules), by hand from the web UI, or via an external trigger
# (e.g. support-docs's GitHub Actions) -- not on pushes here, since code-only
# changes to this repo shouldn't force a re-ingest. Ingest is incremental
# (content hashes), so a run with no doc changes embeds nothing.
#
# Needs CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN as GitLab CI/CD
# variables on this project (Settings > CI/CD > Variables) -- see CLAUDE.md.
rag-ingest:
  image: node:22-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates # slim image has no git
  script:
    - git clone --depth 1 https://github.com/nesi/support-docs.git support-docs # public, no auth needed
    - bash scripts/ingest_local.sh support-docs/docs # same wrapper used locally

# Pure-logic unit tests (scoring maths, path validation, chunk ids, answer
# formatting) -- no Worker, no network, no credentials, so these run on every
# push. Deliberately separate from rag-ingest: this shouldn't wait on or
# trigger a re-ingest, and rag-ingest shouldn't wait on or trigger this.
unit-tests:
  image: node:22-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - node scripts/eval-search.test.mjs
    - node scripts/eval-read.test.mjs
    - node scripts/eval-chunk.test.mjs
    - node scripts/eval-format.test.mjs
    - node scripts/eval-junk.test.mjs
    - node scripts/eval-status.test.mjs
    - node scripts/eval-breaks.test.mjs
    - node --input-type=module -e 'import { loadCases } from "./scripts/lib-eval.mjs"; loadCases("evals/questions.jsonl")' # eval-set shape check (validateCase)
    - node scripts/eval-ingest.test.mjs

# Every eval `paths` entry must exist in support-docs main -- pages get
# renamed/moved, and a stale path silently turns a correct retrieval into a
# miss. Needs network (public clone) but no credentials. Only runs when the
# eval set or the checker changes, or by hand.
eval-paths:
  image: node:22-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - evals/questions.jsonl
        - scripts/check-eval-paths.mjs
        - scripts/lib-eval.mjs
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
  script:
    - git clone --depth 1 https://github.com/nesi/support-docs.git support-docs
    - node scripts/check-eval-paths.mjs support-docs/docs
